name: Supabase keep-alive

# Free Supabase projects pause after a week without activity, which would
# break the landing's application form. A cheap read every 3 days prevents it.
on:
  schedule:
    - cron: '17 13 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query pilot slots
        env:
          # Publishable key: already public in landing/assets/app.js
          SUPABASE_URL: https://txrevckvhxaaywtjsmjg.supabase.co
          SUPABASE_KEY: sb_publishable_63HxRaMPbw1EdE5W0RxV6A_qRRv0-NP
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/pilot_slots" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}'
