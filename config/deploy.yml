# Config de Kamal — generada por deploy-starter
# Docs: https://kamal-deploy.org
#
# Este archivo SÍ se commitea. Los valores variables (IP, password)
# los inyecta GitHub Actions vía ENV.

service: saludbot

image: avarajar/saludbot

servers:
  web:
    - <%= ENV["SERVER_IP"] %>

proxy:
  ssl: false
  host: <%= ENV["DOMAIN"] %>
  app_port: 3000
  healthcheck:
    path: /api/health
    interval: 3
    timeout: 30

registry:
  server: ghcr.io
  username: avarajar
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root

builder:
  arch: amd64

env:
  clear:
    NODE_ENV: production
    PORT: 3000
  # Cuando necesites secrets, añade aquí:
  # secret:
  #   - ANTHROPIC_API_KEY
  #   - NEXT_PUBLIC_SUPABASE_URL
  #   (etc. — también destapar en .github/workflows/deploy.yml)
